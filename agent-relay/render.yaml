services:
  - type: web
    name: relay-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m relay.warm
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FALKOR_HOST
        sync: false
      - key: FALKOR_PORT
        sync: false
      - key: FALKOR_USER
        sync: false
      - key: FALKOR_PASS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
